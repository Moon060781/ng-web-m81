<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoorGee WebMaster | eCommerce & Web Solutions</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        :root {
            --brand-brown: #5d4037;
            --brand-brown-dark: #3e2723;
            --brand-gold: #d4af37;
        }
        body { 
            font-family: 'Poppins', sans-serif; 
            background-color: #fdfaf9;
            overflow-x: hidden;
        }
        .font-urdu { font-family: 'Noto Nastaliq Urdu', serif; }
        
        .gradient-text {
            background: linear-gradient(to right, #5d4037, #d4af37);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Portfolio Specific Styles */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(93, 64, 55, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .glass-card:hover {
            transform: translateY(-10px);
            border-color: var(--brand-gold);
            box-shadow: 0 20px 40px rgba(93, 64, 55, 0.1);
        }

        #portfolio-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            padding: 20px;
            align-items: center;
            justify-content: center;
        }

        .modal-container {
            background: white;
            width: 100%;
            max-width: 1000px;
            height: 80vh;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 768px) {
            .modal-container { flex-direction: row; }
        }

        .filter-btn.active {
            background-color: var(--brand-brown);
            color: white;
        }

        .hero-bg {
            background: linear-gradient(rgba(253, 250, 249, 0.94), rgba(253, 250, 249, 0.85)), 
                        url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="fixed top-0 left-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-amber-800 rounded-xl flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-n text-xl"></i>
                </div>
                <span class="text-2xl font-black tracking-tighter text-slate-900">NoorGee<span class="text-amber-800">.</span></span>
            </div>
            <div class="hidden md:flex items-center gap-10">
                <a href="#home" class="text-sm font-bold text-slate-900">Home</a>
                <a href="#services" class="text-sm font-bold text-slate-600">Services</a>
                <a href="#portfolio" class="text-sm font-bold text-slate-600">Portfolio</a>
                <a href="#contact" class="px-6 py-2.5 bg-slate-900 text-white text-sm font-bold rounded-full">Hire Us</a>
            </div>
        </div>
    </nav>

    <!-- Hero -->
    <section id="home" class="min-h-screen flex items-center pt-20 hero-bg">
        <div class="container mx-auto px-6 text-center md:text-left">
            <div class="max-w-3xl">
                <h1 class="text-6xl md:text-8xl font-black text-slate-900 leading-tight mb-8">
                    Digital <span class="gradient-text">Excellence</span> Redefined.
                </h1>
                <p class="text-xl text-gray-600 mb-10">Premium Web Solutions and AI Automation for Global Growth.</p>
                <a href="#portfolio" class="px-10 py-5 bg-slate-900 text-white font-bold rounded-2xl shadow-xl inline-block">Explore Portfolio</a>
            </div>
        </div>
    </section>

    <!-- Portfolio Section -->
    <section id="portfolio" class="py-24 bg-slate-50">
        <div class="container mx-auto px-6 text-center">
            <h2 class="text-5xl font-bold mb-4 font-urdu text-slate-900">ہمارے شاہکار (Masterpieces)</h2>
            <p class="text-gray-500 mb-12">ایکسپلوور کریں ہمارے تمام ویب اور اے آئی پروجیکٹس کا مجموعہ</p>

            <!-- Toggle Button (The Door) -->
            <button id="toggle-gallery" class="group relative px-12 py-5 bg-amber-800 text-white font-bold rounded-full overflow-hidden transition-all hover:scale-105 shadow-2xl">
                <span id="btn-text" class="relative z-10 flex items-center gap-3">
                    <i class="fas fa-door-open"></i> تمام 25 پروجیکٹس دیکھیں
                </span>
            </button>

            <!-- Integrated Gallery Container -->
            <div id="gallery-wrapper" class="hidden mt-16 opacity-0">
                <!-- Filters -->
                <div class="flex flex-wrap justify-center gap-4 mb-12">
                    <button onclick="filterGallery('all')" class="filter-btn active px-8 py-2.5 rounded-full border border-slate-200 text-sm font-bold transition-all">All Projects</button>
                    <button onclick="filterGallery('web')" class="filter-btn px-8 py-2.5 rounded-full border border-slate-200 text-sm font-bold transition-all">Web & Hosting</button>
                    <button onclick="filterGallery('ai')" class="filter-btn px-8 py-2.5 rounded-full border border-slate-200 text-sm font-bold transition-all">AI & Automation</button>
                </div>

                <!-- Grid -->
                <div id="portfolio-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- Cards will be injected here -->
                </div>
            </div>
        </div>
    </section>

    <!-- Portfolio Modal -->
    <div id="portfolio-modal" onclick="closeModal()">
        <div class="modal-container" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-5 right-5 z-50 bg-white/80 w-10 h-10 rounded-full shadow-lg">&times;</button>
            <div id="modal-content" class="flex flex-col md:flex-row w-full h-full">
                <!-- Content Injected here -->
            </div>
        </div>
    </div>

    <!-- Contact & Footer (Simplified for Demo) -->
    <footer id="contact" class="py-20 bg-slate-900 text-white text-center">
        <p>© 2026 NoorGee WebMaster | Premium Digital Solutions</p>
    </footer>

    <script>
        const portfolioData = [
            { id: 1, cat: 'web', title: "Business & IT Consultant", desc: "Digital audit & CRM integration.", goal: "Enterprise industrialist solutions.", link: "https://businessitc.com/", tech: "Web, CRM", media: "https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=500", type: 'img' },
            { id: 2, cat: 'web', title: "NoorGee Main Site", desc: "Main portal for all works.", goal: "Skill showcase.", link: "https://noorgee.com", tech: "Web, Portfolio", media: "https://images.unsplash.com/photo-1498050108023-c5249f4df085?q=80&w=500", type: 'img' },
            { id: 3, cat: 'web', title: "US NoorGee Store", desc: "eCommerce store for USA.", goal: "Leather products dropshipping.", link: "https://us.noorgee.com", tech: "WordPress, Woo", media: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=500", type: 'img' },
            { id: 14, cat: 'ai', title: "AI Post Generator", desc: "Creative AI posters.", goal: "Visual automation.", link: "#", tech: "Stable Diffusion", media: "https://images.unsplash.com/photo-1675271591211-126ad94e495d?q=80&w=500", type: 'img' },
            { id: 18, cat: 'ai', title: "Kangaroo Bag Play", desc: "AI video generation.", goal: "Product marketing.", link: "#", tech: "Sora/Kling AI", media: "https://noorgee.pk/Web/img/kangaroo%20ng%20bag_playing_202508300730_ql3s0.mp4", type: 'video' },
            { id: 22, cat: 'ai', title: "Blog NoorGee (AI Auto)", desc: "English AI blog writing.", goal: "Automation writing.", link: "https://blog.noorgee.com", tech: "Automation", media: "https://images.unsplash.com/photo-1488190211105-8b0e65b80b4e?q=80&w=500", type: 'img' }
            // 25 پروجیکٹس کا مکمل ڈیٹا یہاں اسی ترتیب سے آئے گا
        ];

        const galleryWrapper = document.getElementById('gallery-wrapper');
        const toggleBtn = document.getElementById('toggle-gallery');
        const grid = document.getElementById('portfolio-grid');

        // Toggle Gallery Function
        toggleBtn.addEventListener('click', () => {
            if (galleryWrapper.classList.contains('hidden')) {
                galleryWrapper.classList.remove('hidden');
                gsap.to(galleryWrapper, { opacity: 1, y: 0, duration: 0.8 });
                toggleBtn.innerHTML = '<span class="relative z-10 flex items-center gap-3"><i class="fas fa-door-closed"></i> گیلری بند کریں</span>';
                toggleBtn.classList.replace('bg-amber-800', 'bg-red-800');
                renderItems('all');
            } else {
                gsap.to(galleryWrapper, { opacity: 0, y: 20, duration: 0.5, onComplete: () => {
                    galleryWrapper.classList.add('hidden');
                }});
                toggleBtn.innerHTML = '<span class="relative z-10 flex items-center gap-3"><i class="fas fa-door-open"></i> تمام 25 پروجیکٹس دیکھیں</span>';
                toggleBtn.classList.replace('bg-red-800', 'bg-amber-800');
            }
        });

        function renderItems(filter) {
            grid.innerHTML = '';
            const filtered = filter === 'all' ? portfolioData : portfolioData.filter(i => i.cat === filter);
            
            filtered.forEach(item => {
                const card = `
                    <div class="glass-card rounded-3xl overflow-hidden group cursor-pointer" onclick="openModal(${item.id})">
                        <div class="h-52 bg-slate-200 relative overflow-hidden">
                            ${item.type === 'video' 
                                ? `<video src="${item.media}" class="w-full h-full object-cover" muted loop onmouseover="this.play()" onmouseout="this.pause()"></video>`
                                : `<img src="${item.media}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700">`
                            }
                            <div class="absolute top-4 left-4 bg-amber-800 text-white text-[10px] px-3 py-1 rounded-full font-bold uppercase tracking-widest">${item.cat}</div>
                        </div>
                        <div class="p-6 text-left">
                            <h3 class="text-xl font-bold mb-2 text-slate-900">${item.title}</h3>
                            <p class="text-slate-500 text-sm mb-4 line-clamp-2">${item.desc}</p>
                            <div class="flex justify-between items-center">
                                <span class="text-[11px] font-bold text-amber-800">${item.tech}</span>
                                <i class="fas fa-arrow-right text-slate-300 group-hover:text-amber-800 transition"></i>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function filterGallery(cat) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderItems(cat);
        }

        function openModal(id) {
            const item = portfolioData.find(i => i.id === id);
            const modal = document.getElementById('portfolio-modal');
            const content = document.getElementById('modal-content');

            content.innerHTML = `
                <div class="md:w-3/5 bg-black">
                    ${item.type === 'video' 
                        ? `<video src="${item.media}" class="w-full h-full object-contain" controls autoplay></video>`
                        : `<img src="${item.media}" class="w-full h-full object-cover">`
                    }
                </div>
                <div class="md:w-2/5 p-8 md:p-12 flex flex-col justify-center text-left">
                    <h2 class="text-3xl font-black text-slate-900 mb-4">${item.title}</h2>
                    <p class="text-slate-600 mb-8">${item.desc}</p>
                    <div class="mb-8">
                        <h4 class="text-xs font-bold text-amber-800 uppercase tracking-widest mb-2">Project Goal</h4>
                        <p class="text-slate-700 font-medium">${item.goal}</p>
                    </div>
                    <a href="${item.link}" target="_blank" class="inline-block py-4 px-8 bg-slate-900 text-white font-bold rounded-2xl text-center shadow-lg hover:bg-amber-800 transition">Visit Project</a>
                </div>
            `;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('portfolio-modal').style.display = 'none';
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
