<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoorGee WebMaster | Global Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .brand-gradient { background: linear-gradient(135deg, #5d4037 0%, #2d1b15 100%); }
        .input-style { @apply w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 focus:border-brown-400 outline-none transition-all text-white; }
    </style>
</head>
<body class="bg-[#0f172a] text-white font-sans">

    <!-- Contact Section -->
    <section id="contact" class="py-20 px-4">
        <div class="max-w-4xl mx-auto">
            <div class="text-center mb-12">
                <h2 class="text-4xl font-bold text-amber-500 mb-4">Get In Touch</h2>
                <p class="text-slate-400 italic">"We translate your vision into digital reality, even if you have zero technical knowledge."</p>
            </div>

            <div class="bg-slate-900/50 p-8 rounded-3xl border border-slate-800 shadow-2xl">
                <form id="contactForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Name -->
                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-slate-400">Full Name *</label>
                        <input type="text" name="name" required placeholder="Enter your name" 
                            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:border-amber-500 outline-none transition-all">
                    </div>

                    <!-- Email -->
                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-slate-400">Email Address *</label>
                        <input type="email" name="email" required placeholder="name@company.com" 
                            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:border-amber-500 outline-none transition-all">
                    </div>

                    <!-- Contact Number -->
                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-slate-400">Contact Number</label>
                        <input type="text" name="contact_no" placeholder="+92 ..." 
                            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:border-amber-500 outline-none transition-all">
                    </div>

                    <!-- Subject -->
                    <div class="space-y-2">
                        <label class="text-sm font-semibold text-slate-400">Subject</label>
                        <input type="text" name="subject" placeholder="Web Development / Maintenance" 
                            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:border-amber-500 outline-none transition-all">
                    </div>

                    <!-- Message -->
                    <div class="md:col-span-2 space-y-2">
                        <label class="text-sm font-semibold text-slate-400">Message *</label>
                        <textarea name="message" required rows="4" placeholder="Tell us about your project..." 
                            class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:border-amber-500 outline-none transition-all resize-none"></textarea>
                    </div>

                    <div class="md:col-span-2">
                        <button type="submit" id="submitBtn" 
                            class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-3">
                            <i class="fas fa-paper-plane"></i> Send Message
                        </button>
                    </div>
                </form>
                <div id="formStatus" class="mt-6 hidden p-4 rounded-xl text-center font-bold"></div>
            </div>
        </div>
    </section>

    <script>
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('formStatus');
            const formData = new FormData(this);
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            try {
                const response = await fetch('send_message.php', { method: 'POST', body: formData });
                const result = await response.json();
                
                status.className = `mt-6 p-4 rounded-xl text-center font-bold ${result.success ? 'bg-green-500/10 text-green-400' : 'bg-red-500/10 text-red-400'}`;
                status.innerText = result.message;
                status.classList.remove('hidden');
                
                if(result.success) this.reset();
            } catch (error) {
                status.className = 'mt-6 p-4 rounded-xl bg-red-500/10 text-red-400 block font-bold';
                status.innerText = 'Connection Error. Please try again.';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane"></i> Send Message';
            }
        });
    </script>
</body>
</html>
