    <script>
        let currentLang = 'ur';
        const content = {
            en: {
                dir: 'ltr',
                align: 'left',
                heroTitle: "Frequently Asked Questions",
                heroSubtitle: "Professional and transparent web services for your business.",
                ctaTitle: "Still have questions?",
                btnWA: "Chat on WhatsApp",
                btnFB: "Message on Facebook",
                btnMsg: "Send Online Message",
                langBtn: "اردو میں دیکھیں",
                faqs: [
                    { q: "What is the 20k Website Package breakdown?", a: "The total cost is 20,000 PKR, which includes: Hosting (10k), Domain (5k), and Development (5k)." },
                    { q: "Is there a monthly maintenance fee?", a: "Yes, we charge 5,000 PKR per month for ongoing maintenance and monitoring." },
                    { q: "How long does it take to go live?", a: "Your website will be live within 2 to 10 hours once we have all details." },
                    { q: "What do you need from me to start?", a: "We need your logo, business text, images, and contact details." }
                ]
            },
            ur: {
                dir: 'rtl',
                align: 'right',
                heroTitle: "عام طور پر پوچھے گئے سوالات",
                heroSubtitle: "آپ کے کاروبار کے لیے پیشہ ورانہ اور شفاف ویب سروسز۔",
                ctaTitle: "ابھی بھی کوئی سوال ہے؟",
                btnWA: "واٹس ایپ پر چیٹ کریں",
                btnFB: "فیس بک پر میسج کریں",
                btnMsg: "آن لائن پیغام بھیجیں",
                langBtn: "Switch to English",
                faqs: [
                    { q: "20 ہزار والے ویب سائٹ پیکیج کی تفصیل کیا ہے؟", a: "کل خرچہ 20,000 روپے ہے: ہوسٹنگ (10 ہزار)، ڈومین (5 ہزار)، اور ڈیولپمنٹ (5 ہزار)۔" },
                    { q: "کیا ماہانہ دیکھ بھال کے اخراجات ہیں؟", a: "جی ہاں، دیکھ بھال اور میسجز مانیٹر کرنے کے لیے ماہانہ 5,000 روپے فیس ہے۔" },
                    { q: "ویب سائٹ لائیو ہونے میں کتنا وقت لگتا ہے؟", a: "تمام تفصیلات ملنے کے بعد صرف 2 سے 10 گھنٹے کے اندر ویب سائٹ لائیو ہو جائے گی۔" },
                    { q: "ویب سائٹ کے لیے ہمیں آپ کو کیا فراہم کرنا ہوگا؟", a: "ہمیں آپ کا لوگو، کام کی تحریر، تصاویر اور رابطہ کی معلومات درکار ہوں گی۔" }
                ]
            }
        };

        function renderFAQs() {
            const container = document.getElementById('faq-container');
            const data = content[currentLang];
            container.innerHTML = data.faqs.map((faq, i) => `
                <div class="bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm">
                    <button onclick="toggleAccordion(${i})" class="w-full px-6 py-5 flex items-center justify-between text-slate-800 hover:bg-slate-50">
                        <span class="text-lg font-bold ${currentLang === 'ur' ? 'font-urdu' : ''}">${faq.q}</span>
                        <span id="icon-${i}" class="rotate-icon text-slate-400">▼</span>
                    </button>
                    <div id="content-${i}" class="accordion-content">
                        <div class="px-8 pb-7 pt-2 text-slate-600 border-t border-slate-50 ${currentLang === 'ur' ? 'font-urdu' : ''}">
                            ${faq.a}
                        </div>
                    </div>
                </div>
            `).join('');
            
            // Update other text
            document.documentElement.dir = data.dir;
            document.body.className = `bg-slate-50 text-${data.align}`;
            document.getElementById('hero-title').innerText = data.heroTitle;
            document.getElementById('hero-subtitle').innerText = data.heroSubtitle;
            document.getElementById('cta-title').innerText = data.ctaTitle;
            document.getElementById('btn-wa').innerText = data.btnWA;
            document.getElementById('btn-fb').innerText = data.btnFB;
            document.getElementById('btn-msg').innerText = data.btnMsg;
            document.getElementById('lang-btn-text').innerText = data.langBtn;
        }

        function toggleAccordion(i) {
            const contentDiv = document.getElementById(`content-${i}`);
            const icon = document.getElementById(`icon-${i}`);
            contentDiv.classList.toggle('active');
            icon.classList.toggle('active');
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ur' : 'en';
            renderFAQs();
        }

        renderFAQs();
    </script>
