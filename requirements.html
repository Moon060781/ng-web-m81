<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Requirements Form | NoorGee WebMaster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #fdfaf9; }
        .btn-brown { background-color: #5d4037; transition: all 0.3s ease; }
        .btn-brown:hover { background-color: #3e2723; transform: translateY(-2px); }
    </style>
</head>
<body class="p-6 md:p-12">
    <div class="max-w-3xl mx-auto bg-white p-8 md:p-12 rounded-[2.5rem] shadow-xl border border-gray-100">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-slate-900 mb-4">Project Requirements</h1>
            <p class="text-gray-500">Please tell us about your project needs before we start designing.</p>
            <div class="w-16 h-1 bg-amber-800 mx-auto mt-4"></div>
        </div>

        <form id="requirementsForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Full Name *</label>
                    <input type="text" name="name" required class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-800/20 transition" placeholder="John Doe">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">Email Address *</label>
                    <input type="email" name="email" required class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-800/20 transition" placeholder="john@example.com">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Website Type *</label>
                <select name="website_type" required class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-800/20 transition">
                    <option value="">Select Type</option>
                    <option value="portfolio">Portfolio Website</option>
                    <option value="ecommerce">E-commerce Store</option>
                    <option value="business">Business Website</option>
                    <option value="blog">Blog / News</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Domain & Hosting Status</label>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <label class="flex items-center gap-3 p-4 bg-slate-50 rounded-2xl border border-slate-100 cursor-pointer">
                        <input type="checkbox" name="need_domain" class="w-5 h-5 accent-amber-800">
                        <span class="text-sm text-gray-600">I need a Domain</span>
                    </label>
                    <label class="flex items-center gap-3 p-4 bg-slate-50 rounded-2xl border border-slate-100 cursor-pointer">
                        <input type="checkbox" name="need_hosting" class="w-5 h-5 accent-amber-800">
                        <span class="text-sm text-gray-600">I need Hosting</span>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Project Description & Features *</label>
                <textarea name="description" rows="5" required class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-800/20 transition" placeholder="Describe your vision, required pages, and any specific features..."></textarea>
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Reference Websites (Optional)</label>
                <input type="text" name="references" class="w-full px-6 py-4 bg-slate-50 border border-slate-100 rounded-2xl focus:outline-none focus:ring-2 focus:ring-amber-800/20 transition" placeholder="e.g. apple.com, stripe.com">
            </div>

            <button type="submit" id="submitBtn" class="w-full py-5 btn-brown text-white font-bold rounded-2xl shadow-xl shadow-brown-600/20 flex items-center justify-center gap-3">
                <i class="fa-solid fa-paper-plane"></i>
                Submit Requirements
            </button>

            <div id="formStatus" class="hidden"></div>
        </form>
    </div>

    <script>
        document.getElementById('requirementsForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('formStatus');
            const formData = new FormData(this);
            btn.disabled = true;
            btn.innerText = 'Submitting...';

            try {
                // Using the existing send_message.php for handling
                const response = await fetch('send_message.php', { method: 'POST', body: formData });
                const result = await response.json();
                status.className = `mt-6 p-4 rounded-2xl text-center font-bold ${result.success ? 'bg-green-500/10 text-green-600' : 'bg-red-500/10 text-red-600'}`;
                status.innerText = result.success ? 'Requirements submitted successfully! We will contact you soon.' : result.message;
                status.classList.remove('hidden');
                if(result.success) this.reset();
            } catch (error) {
                status.className = 'mt-6 p-4 rounded-2xl bg-red-500/10 text-red-600 block font-bold text-center';
                status.innerText = 'System Error. Please try again.';
                status.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Submit Requirements';
            }
        });
    </script>
</body>
</html>
