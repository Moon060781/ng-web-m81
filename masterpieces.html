        const apiKey = ""; // API key is populated securely by the environment at runtime

        async function fetchGeminiContent(prompt, retries = 5) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: prompt }] }]
            };
            
            // Exponential backoff strategy
            const delays = [1000, 2000, 4000, 8000, 16000];
            
            for (let i = 0; i <= retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "No insights generated.";
                } catch (error) {
                    if (i === retries) throw error; // If out of retries, bubble up the error
                    await new Promise(resolve => setTimeout(resolve, delays[i])); // Wait and retry
                }
            }
        }

            `;

                const responseText = await fetchGeminiContent(promptContext);
